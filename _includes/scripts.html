<script type="module" src="{{ '/assets/js/main.min.js' | relative_url }}"></script>

<script>
  (function () {
    function initThemeToggle() {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;

      function getCurrentTheme() {
        var stored = localStorage.getItem('theme');
        if (stored === 'dark' || stored === 'light') return stored;

        var attr = document.documentElement.getAttribute('data-theme');
        if (attr === 'dark' || attr === 'light') return attr;

        if (window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches) {
          return 'dark';
        }
        return 'light';
      }

      function applyTheme(theme) {
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      }

      var current = getCurrentTheme();
      applyTheme(current);

      btn.addEventListener('click', function (e) {
        e.preventDefault();
        current = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', current);
        applyTheme(current);
      });
    }

    function initAboutTypewriter() {
      var el = document.querySelector('.about-typing');
      if (!el) return;                 // no target paragraph

      var fullText = el.textContent;
      if (!fullText || !fullText.trim()) return;

      fullText = fullText.trim();
      el.textContent = '';             // clear initial text

      var i = 0;
      var speed = 30;                  // ms per character

      var timer = setInterval(function () {
        i++;
        el.textContent = fullText.slice(0, i);
        if (i >= fullText.length) {
          clearInterval(timer);
        }
      }, speed);
    }

    function initAll() {
      initThemeToggle();
      initAboutTypewriter();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initAll);
    } else {
      initAll();
    }
  })();
</script>
